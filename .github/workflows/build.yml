name: Build Flatpak

on:
  # Rebuild once a day
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  flatter:
    name: Build Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/andyholmes/flatter/gnome:44
      options: --privileged

    strategy:
      matrix:
        arch: [x86_64]
      fail-fast: false
      # Only one job at a time can use the shared repository cache
      max-parallel: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup GPG
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v5
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create flatpakrepo file
        shell: bash
        run: |
          github_pages_url=$(curl -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer {{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages | jq -r ".html_url")

          cat > default.flatpakrepo <<- EOF
          [Flatpak Repo]
          Title=github.com/${{ github.repository }}
          Url=$github_pages_url
          Homepage=${{ github.server_url }}/${{ github.repository }}
          Comment=Custom Flatpak repository of ${{ github.repository }} on GitHub
          Description=Custom Flatpak repository of ${{ github.repository }} on GitHub
          GPGKey=${{ steps.gpg.outputs.fingerprint }}
          EOF

      - name: Build
        uses: andyholmes/flatter@adcf29af6c60fefb5fda4ab1c059ed8a022a69f0
        with:
          files: |
            io.github.cr7pt0gr4ph7.flatpaks.sonic-visualiser/io.github.cr7pt0gr4ph7.flatpaks.sonic-visualiser.yml
          arch: ${{ matrix.arch }}
          gpg-sign: ${{ steps.gpg.outputs.fingerprint }}
          upload-bundles: true
          upload-pages-artifact: true
          upload-pages-include: |
            default.flatpakrepo
          flatpak-builder-args: |
            --install-deps-from=flathub

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: flatter
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
