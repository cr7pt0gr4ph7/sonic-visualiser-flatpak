app-id: io.github.cr7pt0gr4ph7.flatpaks.sonic-visualiser
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: /app/bin/sonic-visualiser
finish-args:
  # IF WINDOW_MANAGER == X11
  # X11 + XShm access
  # - --share=ipc
  # - --socket=x11
  # ELSIF WiNDOW_MANAGER == WAYLAND
  # X11 + XShm access
  - --share=ipc
  - --socket=fallback-x11
  # Wayland access
  - --socket=wayland
  # ENDIF
  # Needs to talk to the network
  - --share=network
  - --talk-name=com.canonical.dbusmenu
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.Flatpak.*
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.a'
  - '*.la'
modules:
  - name: sonic-visualiser
    buildsystem: simple
    build-commands:
      - unappimage appimage
      - rm -f appimage
      - |
        for s in 16 32 48 64 128 256 512; do
          install -Dm644 ${s}.png /app/share/icons/hicolor/${s}x${s}/apps/${FLATPAK_ID}.png
        done
      - install -Dm644 squashfs-root/sonic-visualiser.desktop /app/share/applications/$FLATPAK_ID.desktop
      - install -Dm644 squashfs-root/sonic-visualiser.svg /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - desktop-file-edit --set-icon=${FLATPAK_ID} /app/share/applications/${FLATPAK_ID}.desktop
      - rm -f squashfs-root/{AppRun,.DirIcon,sonic-visualiser.desktop,sonic-visualiser.svg,sv-icon.svg}
      - rm -rf squashfs-root/usr/lib/qt6
      - rm -f squashfs-root/usr/lib/libbrotlicommon.so.*
      - rm -f squashfs-root/usr/lib/libbrotlidec.so.*
      - rm -f squashfs-root/usr/lib/libcap.so.*
      - rm -f squashfs-root/usr/lib/libcrypto.so.*
      - rm -f squashfs-root/usr/lib/libdbus-1.so.*
      - rm -f squashfs-root/usr/lib/libffi.so.*
      - rm -f squashfs-root/usr/lib/libfftw3.so.*
      - rm -f squashfs-root/usr/lib/libgcrypt.so.*
      - rm -f squashfs-root/usr/lib/libglib-2.0.so.*
      # - rm -f squashfs-root/usr/lib/libgnutls.so.*
      - rm -f squashfs-root/usr/lib/libgomp.so.*
      - rm -f squashfs-root/usr/lib/libgraphite2.so.*
      - rm -f squashfs-root/usr/lib/libidn2.so.*
      - rm -f squashfs-root/usr/lib/liblz4.so.*
      - rm -f squashfs-root/usr/lib/liblzma.so.*
      - rm -f squashfs-root/usr/lib/libnettle.so.*
      - rm -f squashfs-root/usr/lib/libnghttp2.so.*
      - rm -f squashfs-root/usr/lib/libogg.so.*
      - rm -f squashfs-root/usr/lib/libopus.so.*
      - rm -f squashfs-root/usr/lib/libpcre.so.*
      - rm -f squashfs-root/usr/lib/libpcre2-16.so.*
      - rm -f squashfs-root/usr/lib/libpng16.so.*
      - rm -f squashfs-root/usr/lib/libproxy.so.*
      - rm -f squashfs-root/usr/lib/libpsl.so.*
      - rm -f squashfs-root/usr/lib/libpulse.so.*
      - rm -f squashfs-root/usr/lib/libQt6Core.so.*
      - rm -f squashfs-root/usr/lib/libQt6DBus.so.*
      - rm -f squashfs-root/usr/lib/libQt6Gui.so.*
      - rm -f squashfs-root/usr/lib/libQt6Network.so.*
      - rm -f squashfs-root/usr/lib/libQt6Svg.so.*
      - rm -f squashfs-root/usr/lib/libQt6Widgets.so.*
      - rm -f squashfs-root/usr/lib/libQt6XcbQpa.so.*
      - rm -f squashfs-root/usr/lib/libQt6Xml.so.*
      - rm -f squashfs-root/usr/lib/libsamplerate.so.*
      - rm -f squashfs-root/usr/lib/libsndfile.so.*
      - rm -f squashfs-root/usr/lib/libspeex.so.*
      - rm -f squashfs-root/usr/lib/libsystemd.so.*
      - rm -f squashfs-root/usr/lib/libtasn1.so.*
      - rm -f squashfs-root/usr/lib/libvorbis.so.*
      - rm -f squashfs-root/usr/lib/libX11-xcb.so.*
      - rm -f squashfs-root/usr/lib/libXau.so.*
      - rm -f squashfs-root/usr/lib/libxcb-icccm.so.*
      - rm -f squashfs-root/usr/lib/libxcb-image.so.*
      - rm -f squashfs-root/usr/lib/libxcb-keysyms.so.*
      - rm -f squashfs-root/usr/lib/libxcb-randr.so.*
      - rm -f squashfs-root/usr/lib/libxcb-render-util.so.*
      - rm -f squashfs-root/usr/lib/libxcb-render.so.*
      - rm -f squashfs-root/usr/lib/libxcb-shape.so.*
      - rm -f squashfs-root/usr/lib/libxcb-shm.so.*
      - rm -f squashfs-root/usr/lib/libxcb-sync.so.*
      - rm -f squashfs-root/usr/lib/libxcb-util.so.*
      - rm -f squashfs-root/usr/lib/libxcb-xfixes.so.*
      - rm -f squashfs-root/usr/lib/libxcb-xinput.so.*
      - rm -f squashfs-root/usr/lib/libxcb-xkb.so.*
      - rm -f squashfs-root/usr/lib/libXdmcp.so.*
      - rm -f squashfs-root/usr/lib/libxkbcommon-x11.so.*
      - rm -f squashfs-root/usr/lib/libxkbcommon.so.*
      - rm -f squashfs-root/usr/lib/libxslt.so.*
      - rm -f squashfs-root/usr/lib/libzstd.so.*
      - rm -rf squashfs-root/usr/lib/qt6
      - mv -t /app/lib squashfs-root/usr/lib/*
      - mv -t /app/bin squashfs-root/usr/bin/*
      - rm -rf squashfs-root/usr
      - rmdir squashfs-root
    sources:
      - type: file
        dest-filename: appimage
        url: https://github.com/sonic-visualiser/sonic-visualiser/releases/download/sv_v5.2.1/SonicVisualiser-5.2.1-x86_64.AppImage
        sha256: e31e7b970db7a9d6e5943c050c0a06c193d2c3fd4a82b6283aa08a9dc798599c
        # size: 0
        x-checker-data:
          type: json
          url: https://api.github.com/repos/sonic-visualiser/sonic-visualiser/releases/latest
          version-query: .tag_name | sub("^sv_v"; "")
          url-query: .assets[] | select(.name=="SonicVisualiser-" + $version + "-x86_64.AppImage")
            | .browser_download_url
      # - type: file
      #   path: io.github.cr7pt0gr4ph7.flatpaks.sonic-visualiser.desktop
      - type: file
        path: icons/16.png
      - type: file
        path: icons/32.png
      - type: file
        path: icons/48.png
      - type: file
        path: icons/64.png
      - type: file
        path: icons/128.png
      - type: file
        path: icons/256.png
      - type: file
        path: icons/512.png
    modules:
      - ../shared-modules/unappimage/unappimage.json
